name: Deploy
# test:   every pull request against main and every push to main, so a direct push can no
#         longer deploy untested code (2026-10-07; the job used to live in ci.yml, PR-only).
# deploy: push to main only, after test; its own concurrency group serializes deploys
#         without queueing PR test runs behind them.
#
# Pull-based deploy (DomiCloud WIREGUARD_MIGRATION_PLAN.md, Phase B): build the image on
# the runner, push it to GHCR, then poke a signed webhook. The VPS pulls the image itself
# and recreates the container — CI never touches SSH, so no deploy key lives here and the
# server's port 22 can stay off the public internet.
#
# Repo secret: WEBHOOK_SECRET (per-app HMAC secret, mirrored in /srv/apps/deploy/.env).
# The compose file on the server is NOT shipped by this workflow anymore — it changes
# rarely; update /srv/apps/zwdatebot/compose.yml by hand when deploy/compose.yml changes.
on:
  push:
    branches: [main]
    # Docs and the Dependabot config never reach the image; a push that touches
    # nothing else would only rebuild and recreate the container for no change.
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
  workflow_dispatch: {}   # manual runs: prove the pipeline
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zwdatebot
          POSTGRES_PASSWORD: zwdatebot
          POSTGRES_DB: zwdatebot_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U zwdatebot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Contract tests run against a real Postgres (they SKIP without one, so this
      # service is what makes CI actually enforce backend parity).
      POSTGRES_TEST_DSN: postgresql://zwdatebot:zwdatebot@localhost:5433/zwdatebot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Provide test config
        # The real secrets/api_config.ini is gitignored; the tracked example carries every
        # section the tests need (storage is in-memory or the service container, no real secrets).
        run: cp secrets/example_api_config.ini secrets/api_config.ini
      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Two quick merges would race on the image push + deploy; serialize and drop
    # superseded runs. Job-level so PR test runs never wait behind a deploy.
    concurrency:
      group: deploy
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write        # push the image to GHCR
      id-token: write        # OIDC token for keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # :latest is what the server's compose.yml references; the sha tag keeps an
          # immutable handle for rollback (retag + `docker compose up -d` on the box).
          tags: |
            ghcr.io/${{ github.repository_owner }}/zwdatebot:latest
            ghcr.io/${{ github.repository_owner }}/zwdatebot:${{ github.sha }}

      # Image scan (DomiCloud handbook 8.11) with a checksum-verified trivy release.
      # The first pass only lists every HIGH/CRITICAL finding in the log; the second
      # fails the job — and with it the deploy, since the webhook step never runs — on
      # a CRITICAL that has a fix available. Unfixed findings cannot be acted on, so
      # they never block. Bump TRIVY_VERSION + TRIVY_SHA256 together (release page →
      # trivy_<v>_checksums.txt).
      - name: Scan image (HIGH+CRITICAL listed, fixable CRITICAL blocks)
        env:
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
          IMAGE: ghcr.io/${{ github.repository_owner }}/zwdatebot@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tgz
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
          ./trivy image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"
          ./trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image digest (keyless, GitHub OIDC)
        env:
          COSIGN_YES: "true"
        run: cosign sign ghcr.io/${{ github.repository_owner }}/zwdatebot@${{ steps.push.outputs.digest }}

      - name: Trigger deploy webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          BODY=$(jq -cn --arg app 'zwdatebot' --arg ref "$GITHUB_REF" --arg run "$GITHUB_RUN_ID" \
            --arg i1 'ghcr.io/${{ github.repository_owner }}/zwdatebot' --arg d1 '${{ steps.push.outputs.digest }}' \
            '{app:$app, digests:{($i1):$d1}, ref:$ref, run_id:$run, ts:(now|floor)}')
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY" \
            https://deploy.ca-do.ch/hook/zwdatebot
