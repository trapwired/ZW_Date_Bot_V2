name: Deploy
# Runs only after a PR is merged (push to main). Tests already ran as a required check on
# the PR, so deployment does not re-run them.
#
# Pull-based deploy (DomiCloud WIREGUARD_MIGRATION_PLAN.md, Phase B): build the image on
# the runner, push it to GHCR, then poke a signed webhook. The VPS pulls the image itself
# and recreates the container — CI never touches SSH, so no deploy key lives here and the
# server's port 22 can stay off the public internet.
#
# Repo secret: WEBHOOK_SECRET (per-app HMAC secret, mirrored in /srv/apps/deploy/.env).
# The compose file on the server is NOT shipped by this workflow anymore — it changes
# rarely; update /srv/apps/zwdatebot/compose.yml by hand when deploy/compose.yml changes.
on:
  push:
    branches: [main]
    # Docs and the Dependabot config never reach the image; a push that touches
    # nothing else would only rebuild and recreate the container for no change.
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
  workflow_dispatch: {}   # manual runs: prove the pipeline
# Two quick merges would race on the image push + deploy; serialize and drop superseded runs.
concurrency:
  group: deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push the image to GHCR
      id-token: write        # OIDC token for keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # :latest is what the server's compose.yml references; the sha tag keeps an
          # immutable handle for rollback (retag + `docker compose up -d` on the box).
          tags: |
            ghcr.io/${{ github.repository_owner }}/zwdatebot:latest
            ghcr.io/${{ github.repository_owner }}/zwdatebot:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image digest (keyless, GitHub OIDC)
        env:
          COSIGN_YES: "true"
        run: cosign sign ghcr.io/${{ github.repository_owner }}/zwdatebot@${{ steps.push.outputs.digest }}

      - name: Trigger deploy webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          BODY=$(jq -cn --arg app 'zwdatebot' --arg ref "$GITHUB_REF" --arg run "$GITHUB_RUN_ID" \
            --arg i1 'ghcr.io/${{ github.repository_owner }}/zwdatebot' --arg d1 '${{ steps.push.outputs.digest }}' \
            '{app:$app, digests:{($i1):$d1}, ref:$ref, run_id:$run, ts:(now|floor)}')
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY" \
            https://deploy.ca-do.ch/hook/zwdatebot
