# Lives at /srv/apps/zwdatebot/compose.yml on the VPS.
# NOT shipped automatically (pull-based deploy) — when this file changes, update the
# server copy by hand. Long polling: no ports, no networks, no Caddy site block.
#
# The bot runs on [Database] backend = postgres + dsn =
# postgresql://zwdatebot:...@postgres:5432/zwdatebot in the server's api_config.ini.
# The central VPS backup auto-discovers the container (nightly pg_dumpall).
services:
  zwdatebot:
    # Built+pushed by CI; pulled here on a signed webhook (no SSH).
    image: ghcr.io/trapwired/zwdatebot:latest
    container_name: zwdatebot
    restart: unless-stopped
    # default = egress (Telegram long polling); db = internal, postgres only
    networks:
      - default
      - db
    # master plan M3 waves 1-4 (2026-10): NNP, caps, limits, read-only where tolerated
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    init: true
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Whole dir, so config changes are a file swap + restart, no image rebuild.
      - ./secrets:/app/secrets:ro

  postgres:
    image: postgres:16
    container_name: zwdatebot-postgres
    restart: unless-stopped
    networks:
      - db
    # master plan M3 waves 1-4 (2026-10): NNP, caps, limits, read-only where tolerated
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 256
    mem_limit: 768m
    environment:
      POSTGRES_USER: zwdatebot
      # Set in /srv/apps/zwdatebot/.env (never in this public repo); the same
      # password goes into the dsn in the server's api_config.ini at cutover.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: zwdatebot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zwdatebot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  # master plan M3 db network (2026-10): postgres has no gateway and no NAT — unreachable from and
  # unable to reach anything outside the project (handbook 10.3).
  db:
    internal: true
